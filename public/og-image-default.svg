<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 顶部装饰条 -->
  <rect width="1200" height="8" fill="#3b82f6"/>
  
  <!-- 底部装饰条 -->
  <rect y="622" width="1200" height="8" fill="#3b82f6"/>
  
  <!-- 左侧装饰圆圈 -->
  <circle cx="100" cy="470" r="60" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- 右侧装饰圆圈 -->
  <circle cx="1100" cy="470" r="60" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- 主标题 -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="90" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Home Organization
  </text>
  
  <!-- 副标题 -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" fill="#e2e8f0">
    Real Solutions • Real Measurements • Real Results
  </text>
  
  <!-- 底部标语 -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#cffafe" font-style="italic">
    Real home organization with before-and-after photos
  </text>
</svg>
